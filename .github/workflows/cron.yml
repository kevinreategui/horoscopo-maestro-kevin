name: Robot Horoscopo Diario

on:
  schedule:
    - cron: '0 5 * * *' 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install
      - run: node generar.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Guardar cambios
        run: |
          git config --global user.name 'Robot Maestro Kevin'
          git config --global user.email 'bot@maestrokevin.com'
          git add horoscopo.json
          git commit -m "✨ Horóscopo actualizado $(date)" || echo "Sin cambios"
          git push